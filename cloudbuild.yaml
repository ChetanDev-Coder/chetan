steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rescuegrid-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rescuegrid-ai:latest'
      - '.'

  # Step 2: Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rescuegrid-ai:$COMMIT_SHA'

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rescuegrid-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rescuegrid-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/rescuegrid-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rescuegrid-ai:latest'
